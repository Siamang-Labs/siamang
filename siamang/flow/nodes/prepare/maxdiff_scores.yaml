type: prepare.maxdiff_scores
category: prepare
title: MaxDiff scores
description: |-
  One counting-score variable per MaxDiff item, per respondent: best minus worst over the times the item was shown.

  With them, the preferences can go into a crosstab, a cluster or a regression.
inputs:
  data: SurveyData
outputs:
  data: SurveyData
  stat: Stat
params:
  question:
    kind: string
    required: true
    label: MaxDiff question
    help: The question's id or name. Its design is read from the questionnaire.
  prefix:
    kind: string
    label: Variable prefix
    help: Each item's score is `<prefix><item code>`. Defaults to the question and `_score_`, so item 3 of `q_md` becomes `q_md_score_3`.
subtitle: '{question} → scores'
imports:
- from siamang.data import maxdiff
template: |
  # Individual counting scores need no model: they are what each respondent
  # picked out of what they were shown. Coarse — a few tasks per person — but
  # real, and a blank where the item was never shown rather than a zero.
  _scored = maxdiff.with_scores({in.data}, {question!r}, prefix={prefix!r})
  {out.data} = _scored.data
  {out.stat} = _scored.stats
preview: stat
