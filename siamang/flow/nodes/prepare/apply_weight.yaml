type: prepare.apply_weight
category: prepare
title: Apply weight
description: Weight the results downstream by a column. Weighted results say so, and a result with no weighted form says it is unweighted.
inputs:
  data: SurveyData
outputs:
  data: SurveyData
params:
  column:
    kind: string
    default: weight
    label: Weight column
    help: 'Weighted: Frequencies, Crosstab (Fisher''s exact test counts respondents), Group means (not N or the test), Descriptive statistics (not N, skewness or kurtosis), Banner table, Net Promoter Score, Regression, TURF, MaxDiff, Conjoint, Share of preference, Principal components, Scale reliability, Correlation and Correlation matrix with Pearson, Bar chart, Heatmap with By, and Proportion CI with Weighted ticked. Unweighted, and saying so: Compare groups, Correlation and Correlation matrix with Spearman or Kendall, t-test, Paired tests, Factor analysis, Cluster (k-means), Box plot, Scatter plot, Heatmap without By, Response quality, Code open answers, Data check, and the counts of MaxDiff scores and Bands. Describe counts rows and adds the weighted base.'
subtitle: '{column}'
template: |
  {out.data} = {in.data}.with_weight({column!r})
preview: rows
