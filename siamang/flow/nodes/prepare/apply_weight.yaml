type: prepare.apply_weight
category: prepare
title: Apply weight
description: Weight the results downstream by a column. Weighted results say so, and a result with no weighted form says it is unweighted.
inputs:
  data: SurveyData
outputs:
  data: SurveyData
params:
  column:
    kind: string
    default: weight
    label: Weight column
    help: |-
      The column that holds each respondent's weight: `weight` unless you name another.

      Weighted:
      - Analyze: Frequencies, Banner table, Net Promoter Score, Regression, TURF, MaxDiff, Conjoint, Share of preference, Principal components, Scale reliability, Key drivers (its tests on Kish's effective N), Price sensitivity
      - Analyze, with a setting: Correlation and Correlation matrix with Pearson, Proportion CI with Weighted checked
      - Visualize: Bar chart (counts, percentages and Split by, its histogram and donut; its confidence intervals and significance letters on Kish's effective base), Heatmap with By or with Pearson, Likert chart, Trend
      - Output: Tab book (Excel)

      Weighted, except a part:
      - Crosstab — not Fisher's exact test, which counts respondents
      - Group means — not N or the test
      - Descriptive statistics — not N, skewness or kurtosis
      - Perceptual map — not its chi-square test, which counts respondents

      Unweighted, and saying so:
      - Analyze: Compare groups, Correlation and Correlation matrix with Spearman or Kendall, t-test, Paired tests, Factor analysis, Cluster (k-means), Data check
      - Visualize: Box plot, Scatter plot, Heatmap without By with Spearman or Kendall
      - Prepare: Response quality, Code open answers, and the counts of MaxDiff scores and Bands

      Describe counts rows and adds the weighted base. Result chart (as the result it draws): weighted where that result is, and its title says which.
subtitle: '{column}'
template: |
  {out.data} = {in.data}.with_weight({column!r})
preview: rows
