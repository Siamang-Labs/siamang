type: prepare.text_code
category: prepare
title: Code open answers
description: Apply a frozen codeframe to an open-text variable — the same answers get the same theme every time, with no model and no network.
inputs:
  data: SurveyData
outputs:
  data: SurveyData
  table: Table
  stat: Stat
params:
  codeframe:
    kind: path
    required: true
    label: Codeframe
    help: The codeframe file (analysis/<name>.codeframe.json) built from these answers.
  into:
    kind: string
    creates: variable
    label: Theme variable
    help: Defaults to the name the codeframe carries.
  sentiment:
    kind: bool
    default: false
    label: Also add sentiment
    help: A sentiment variable beside the theme, and each theme's negative / neutral / positive split in the table. Only when the codeframe was built with it — the stat says when it was not.
subtitle: '{codeframe}'
imports:
- from siamang.data import text_coding
template: |
  _codeframe = text_coding.load({codeframe!r})
  {out.data} = text_coding.apply(
      {in.data}, _codeframe, into={into!r}, sentiment={sentiment!r}
  )
  # Coverage travels with the themes: a theme share is of the coded answers,
  # and how many answers the codeframe had never seen is the other half of it.
  {out.table} = {out.data}.report.themes(_codeframe, sentiment={sentiment!r})
  {out.stat} = {out.table}.stats
preview: table
