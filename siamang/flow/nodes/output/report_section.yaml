type: output.report_section
category: output
title: Report section
description: A heading, text and any number of tables, charts and statistics.
  Without a heading it is a plain block of Markdown between the sections around it.
inputs:
  items:
    type:
    - Table
    - Chart
    - Stat
    many: true
    optional: true
outputs:
  report: Report
params:
  heading:
    kind: string
    label: Heading
  text:
    kind: markdown
    label: Text
  captions:
    kind: captions
    label: Captions
  layout:
    kind: layout
    label: Size and placement
    help: Per item — a width (60%, 320px), an alignment, or a page break before it. The Markdown is unaffected.
  note:
    kind: markdown
    label: Note
subtitle: '{heading}'
imports:
- from siamang.reporting import Report
template:
- |
  {out.report} = Report()
- when: heading
  code: |
    {out.report}.heading({heading!r})
- when: text
  code: |
    {out.report}.text({text!r})
- |
  for _item, _caption, _layout in zip({in.items}, {captions!r}, {layout!r}, strict=True):
      {out.report}.add(_item, caption=_caption, **_layout)
- when: note
  code: |
    {out.report}.note({note!r})
preview: report
