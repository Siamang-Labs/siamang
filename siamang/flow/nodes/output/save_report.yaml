type: output.save_report
category: output
title: Save report
description: Combine sections into one report and save it as Markdown (and HTML, and its tables in Excel).
  Markdown carries the content; HTML carries the look the theme describes.
inputs:
  sections:
    type: Report
    many: true
outputs:
  report: Report
params:
  title:
    kind: string
    required: true
    label: Title
  path:
    kind: path
    default: outputs/report.md
    label: Path
  html:
    kind: bool
    default: true
    label: Also save HTML
  interactive:
    kind: bool
    default: false
    label: Interactive charts in HTML
    help: |-
      The HTML draws its charts in the reader's browser, with:
      - a tooltip on every bar, point and cell with its value and base
      - a legend whose entries hide and show their series
      - zoom where it helps

      It still opens offline, so it can be sent to a client as it is. For that, it carries the chart libraries (Vega, Vega-Lite and Vega-Embed, about 0.8 MB, written in once) and the numbers each chart draws.

      A scatter plot's points and a box plot's outliers are respondents' own values, so those values are in the HTML too.

      Each chart's picture stays in the HTML for printing and for readers without scripts; the Markdown and the Excel workbook are unchanged.

      Applies only with Also save HTML.
  toc:
    kind: bool
    default: false
    label: Table of contents
  xlsx:
    kind: bool
    default: false
    label: Also save tables to Excel
    help: |-
      Every table of the report in one workbook beside it, named as the report with `.xlsx`:
      - a Contents sheet first
      - a sheet per table, named by its caption or its section's heading, with its statistics under it

      Banner tables keep their significance letters. Group means keeps its post-hoc pairs, on a sheet of their own. Charts are left out.
  theme:
    kind: theme
    label: Look
    help: |-
      Typefaces, measure, table style and page size of the rendered report, and the chart colors and font of every chart in it whose Palette is `theme` (in the Markdown's figures too).

      Its P values setting (`p_values`) says how the report writes a p-value:
      - `exact` (Exact) — every p as computed (the default)
      - `0.01` (< 0.01) — a p below 0.01 is written < 0.01
      - `0.001` (< 0.001) — a p below 0.001 is written < 0.001

      That holds in its tables' cells and statistics lines, the Markdown as the HTML, the Excel workbook (a number format, so the cell keeps its number) and the charts' notes (< .01). The results and their exports keep the exact p.

      Otherwise the Markdown's text is unaffected.
subtitle: '{path}'
checks:
- when: interactive=True & html=False
  severity: warning
  message: Interactive charts in HTML draws the charts of the HTML — turn on Also save HTML; the Markdown and the Excel workbook keep their pictures.
imports:
- import os
- from pathlib import Path
- from siamang.reporting import Report
# SIAMANG_PROVENANCE is set by the platform that runs the flow and by a
# research bundle's run.sh: the report's footer says what it was made from.
# Written as it always was unless Interactive charts is on (with the HTML):
# a stored flow renders the same code. On, the Markdown's figures have their
# Vega-Lite specs beside them (report_fig_3.vl.json) and the HTML draws them.
template:
- |
  {out.report} = Report.combine({in.sections}, title={title!r}, toc={toc!r}, theme={theme!r})
  {out.report}.provenance(os.environ.get("SIAMANG_PROVENANCE"))
- when: html!=True
  code: |
    {out.report}.save({path!r})
- when: html=True & interactive!=True
  code: |
    {out.report}.save({path!r})
- when: html=True & interactive=True
  code: |
    {out.report}.save({path!r}, interactive=True)
- when: html=True & interactive!=True
  code: |
    {out.report}.save(Path({path!r}).with_suffix(".html"))
- when: html=True & interactive=True
  code: |
    {out.report}.save(Path({path!r}).with_suffix(".html"), interactive=True)
- when: xlsx
  code: |
    {out.report}.save_tables(Path({path!r}).with_suffix(".xlsx"))
preview: report
