type: output.save_report
category: output
title: Save report
description: Combine sections into one report and save it as Markdown (and HTML).
inputs:
  sections:
    type: Report
    many: true
outputs:
  report: Report
params:
  title:
    kind: string
    required: true
    label: Title
  path:
    kind: path
    default: outputs/report.md
    label: Path
  html:
    kind: bool
    default: false
    label: Also save HTML
  toc:
    kind: bool
    default: false
    label: Table of contents
subtitle: '{path}'
imports:
- import os
- from pathlib import Path
- from siamang.reporting import Report
# SIAMANG_PROVENANCE is set by the platform that runs the flow and by a
# research bundle's run.sh: the report's footer says what it was made from.
template:
- |
  {out.report} = Report.combine({in.sections}, title={title!r}, toc={toc!r})
  {out.report}.provenance(os.environ.get("SIAMANG_PROVENANCE"))
  {out.report}.save({path!r})
- when: html
  code: |
    {out.report}.save(Path({path!r}).with_suffix(".html"))
preview: report
