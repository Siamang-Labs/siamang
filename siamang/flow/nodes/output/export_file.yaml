type: output.export_file
category: output
title: Export file
description: 'Write the data as a file (format by extension: `.parquet`, `.csv`, `.xlsx`, `.sav`, `.dta`) with its dictionary, as an R bundle (`.R`), or the dictionary alone (`.json`).'
inputs:
  data: SurveyData
params:
  path:
    kind: path
    required: true
    label: Path
    help: |-
      The file's extension picks what is written:
      - `.parquet`, `.csv`, `.xlsx`, `.sav` or `.dta` — the data, and `<name>.dictionary.json` beside it
      - `.R` — `<name>.csv`, `<name>.dictionary.json` and an R script that reads them with factors and NA for the missing codes
      - `.json` — the codebook alone
subtitle: '{path}'
imports:
- from siamang.io.export import export_file
template: |
  export_file({in.data}, {path!r})
