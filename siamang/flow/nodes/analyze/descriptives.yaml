type: analyze.descriptives
category: analyze
title: Descriptive statistics
description: N, missing, mean, SD, median, minimum and maximum of several numeric variables — by group if you like, with quartiles, skewness and kurtosis on request.
inputs:
  data: SurveyData
outputs:
  table: Table
  stat: Stat
params:
  variables:
    kind: variables
    required: true
    scales:
    - ordinal
    - interval
    - ratio
    label: Variables
    help: The codebook's missing codes (a 99 "Don't know") are not answers and count as missing.
  by:
    kind: variable
    scales:
    - nominal
    - ordinal
    label: By group
    help: |-
      Optional. One row per variable and group.

      A blank or a missing code of the group variable is no group. A multiple-choice question gives one group per option, and they overlap.
  detail:
    kind: bool
    default: false
    label: Quartiles, skewness and kurtosis
  layout:
    kind: enum
    values:
    - long
    - means
    default: long
    label: Layout
    help: |-
      How the table is laid out with By group:
      - `long` — a row per variable and group with N, mean, SD, median, minimum and maximum
      - `means` — a row per variable and a column per group with its mean, a compact profile of the groups; their sizes are under the table
subtitle: '{variables}'
checks:
- when: layout=means
  require: by!=None
  message: The means layout shows each group's mean — choose a By group, or the long layout.
template:
- when: layout=long
  code: |
    # On weighted data the mean, SD, median and quartiles are weighted, N and
    # Missing stay counts of respondents, and the stat gives Kish's effective N.
    {out.table} = {in.data}.report.descriptives({variables!r}, by={by!r}, detail={detail!r})
- when: layout=means
  code: |
    # A row per variable, a column per group with its mean (weighted on
    # weighted data); the groups' sizes and Kish's effective N in the stat.
    {out.table} = {in.data}.report.descriptives({variables!r}, by={by!r}, layout="means")
- |
  {out.stat} = {out.table}.stats
preview: table
