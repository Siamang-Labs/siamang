type: analyze.turf
category: analyze
title: TURF
description: How many different people a shortlist of options reaches together — each respondent counted once, however many options they chose.
inputs:
  data: SurveyData
outputs:
  table: Table
  stat: Stat
params:
  items:
    kind: variables
    required: true
    label: Options
    help: One 0/1 column per option. Run Explode multiple choice on a multiple-choice question to get them.
  max_size:
    kind: int
    default: 3
    minimum: 1
    label: Largest portfolio
  method:
    kind: enum
    values:
    - best
    - greedy
    - fixed
    default: best
    label: Search
    help: |-
      How the portfolios are found:
      - `best` — tries every combination.
      - `greedy` — extends the previous winner. It is fast, but can miss the best portfolio.
      - `fixed` — searches nothing and reads the Portfolio below.

      The table says which search ran.
  include:
    kind: variables
    default: []
    label: Always include
    help: Options that are in the portfolio whatever they add — shelf space already committed.
  portfolio:
    kind: variables
    default: []
    label: Portfolio
    help: |-
      With Search `fixed`: exactly these options. Empty reads every option.

      The table gives each one's reach, what only it reaches, and the reach and frequency of all of them together.
subtitle:
- when: method=fixed
  text: fixed portfolio {portfolio}
- up to {max_size}, {method}
checks:
- when: method=fixed & include
  severity: warning
  message: Always include is not read with Search = fixed, which evaluates exactly the Portfolio — add those options to Portfolio.
- when: method!=fixed & portfolio
  severity: warning
  message: Portfolio is read only with Search = fixed; best and greedy search for a portfolio themselves.
imports:
- from siamang.data import turf
template:
- code: |
    # Reach is respondents: somebody who chose two of the options still counts
    # once. The base is the people who answered the question, so a reach of 60 %
    # is 60 % of them and never of everyone in the file.
- when: method=fixed
  code: |
    _variables = {in.data}.variables or {}
    {out.table} = turf.evaluate(
        {in.data}.frame,
        {portfolio!r},
        items={items!r},
        weight={in.data}.weight,
        labels={name: _variables[name].label for name in {items!r} if name in _variables},
    )
    {out.stat} = dict(
        Base={out.table}.base,
        Search="none: a fixed portfolio",
        Reach=f"{{out.table}['reach_percent'].iloc[-1]} %",
        Frequency=float({out.table}["frequency"].iloc[-1]),
        Note="each respondent counted once; reach is of the respondents who answered",
    )
- when: method=best
  code: &search |
    {out.table} = turf.turf(
        {in.data}.frame,
        {items!r},
        max_size={max_size!r},
        method={method!r},
        include={include!r},
        weight={in.data}.weight,
        labels=turf.labels_of({in.data}, {items!r}),
    )
    {out.stat} = dict(
        Base={out.table}.base,
        Search={out.table}.method,
        Note="each respondent counted once; reach is of the respondents who answered",
    )
- when: method=greedy
  code: *search
- code: |
    if {in.data}.weight:  # the base, the reach and the frequency are weighted
        {out.stat}["Weight"] = {in.data}.weight
preview: table
