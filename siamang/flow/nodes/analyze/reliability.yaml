type: analyze.reliability
category: analyze
title: Scale reliability
description: Cronbach's alpha for a set of items, with item–total correlations and alpha if deleted.
inputs:
  data: SurveyData
outputs:
  table: Table
  stat: Stat
params:
  items:
    kind: variables
    required: true
    scales:
    - ordinal
    - interval
    - ratio
    label: Items
subtitle: 'α of {items}'
imports:
- from siamang.reporting.model_tables import reliability_table
template: |
  _scale = {in.data}.analysis.reliability({items!r})
  # Each item with its label, rounded; alpha, the items and N under the table.
  {out.table} = reliability_table(_scale, {in.data})
  {out.stat} = _scale.stats
preview: table
