type: analyze.means
category: analyze
title: Group means
description: Mean, SD, median and N of a variable by group, with a significance test — chosen for you, or by hand with post-hoc comparisons of every pair of groups.
inputs:
  data: SurveyData
outputs:
  table: Table
  stat: Stat
params:
  y:
    kind: variable
    required: true
    scales:
    - ordinal
    - interval
    - ratio
    label: Variable
  by:
    kind: variable
    required: true
    scales:
    - nominal
    - ordinal
    label: By
  test:
    kind: bool
    default: true
    label: Significance test
  method:
    kind: enum
    values:
    - auto
    - student
    - welch
    - anova
    - welch_anova
    - mannwhitney
    - kruskal
    default: auto
    label: Test
    help: |-
      The significance test that compares the groups:
      - `auto` — chooses by scale and groups: a t-test or ANOVA for interval data, Mann-Whitney or Kruskal-Wallis for ordinal
      - `student` — compares two groups
      - `welch` — compares two groups and does not assume equal variances
      - `anova` or `welch_anova` — compare two or more groups
      - `mannwhitney` — compares the ranks of two groups
      - `kruskal` — compares the ranks of two or more groups

      A test chosen here reports df and an effect size and leaves the codebook's missing codes out.

      `auto` counts missing codes as answers, as it always has, and says so (Missing codes counted as answers). Run the Missing values node first to leave them out.
  posthoc:
    kind: enum
    values:
    - none
    - tukey
    - games_howell
    - dunn
    default: none
    label: Post-hoc
    help: |-
      Compares every pair of groups after the test. The pairs appear under the table.

      Each one needs its own Test:
      - `tukey` — Tukey's HSD, with Test `anova`
      - `games_howell` — Games-Howell, with Test `welch_anova`
      - `dunn` — Dunn's test, with Test `kruskal`
  adjust:
    kind: enum
    values:
    - holm
    - bonferroni
    default: holm
    label: Dunn p adjustment
    help: How Dunn's p-values allow for the number of pairs. Tukey and Games-Howell allow for it themselves.
subtitle: '{y} by {by}'
checks:
- when: posthoc=tukey
  require: method=anova
  message: Tukey's HSD follows a one-way ANOVA — set Test to anova, or Post-hoc to none.
- when: posthoc=games_howell
  require: method=welch_anova
  message: Games-Howell follows Welch's ANOVA — set Test to welch_anova, or Post-hoc to none.
- when: posthoc=dunn
  require: method=kruskal
  message: Dunn's test follows Kruskal-Wallis — set Test to kruskal, or Post-hoc to none.
- when: test=False & method!=auto
  severity: warning
  message: Test is not run while Significance test is off.
- when: test=False & posthoc!=none
  severity: warning
  message: Post-hoc is not run while Significance test is off.
template:
- when: method=auto & posthoc=none
  code: |
    {out.table} = {in.data}.report.means({y!r}, by={by!r}, test={test!r})
# Dunn's p adjustment is written only where it is read: Tukey and Games-Howell
# allow for the number of pairs themselves, so the field is shown with Dunn only.
- when: method!=auto & posthoc!=dunn
  code: |
    {out.table} = {in.data}.report.means(
        {y!r}, by={by!r}, test={test!r}, method={method!r}, posthoc={posthoc!r}
    )
- when: method!=auto & posthoc=dunn
  code: |
    {out.table} = {in.data}.report.means(
        {y!r}, by={by!r}, test={test!r}, method={method!r}, posthoc="dunn", adjust={adjust!r}
    )
- |
  {out.stat} = {out.table}.stats
preview: table
