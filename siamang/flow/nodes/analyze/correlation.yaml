type: analyze.correlation
category: analyze
title: Correlation
description: Pearson, Spearman or Kendall correlation between two variables, with its p-value and N — Pearson with a 95 % CI, and weighted when a weight is applied.
inputs:
  data: SurveyData
outputs:
  stat: Stat
params:
  x:
    kind: variable
    required: true
    scales:
    - ordinal
    - interval
    - ratio
    label: X
  y:
    kind: variable
    required: true
    scales:
    - ordinal
    - interval
    - ratio
    label: Y
  method:
    kind: enum
    values:
    - pearson
    - spearman
    - kendall
    default: spearman
    label: Method
    help: |-
      Which correlation to compute:
      - `pearson` — a straight-line relationship, with a 95 % CI. It is weighted when a weight is applied, and it leaves the codebook's missing codes (a `9` = Refused) out and says how many.
      - `spearman` — the default. It correlates ranks and suits rating scales; it is not weighted, and says so. It counts the missing codes as answers, as this node always has, so flows made before keep their numbers. It says so in `missing_codes_counted`.
      - `kendall` (tau-b) — correlates ranks and suits rating scales. It is not weighted, and says so; it leaves the missing codes out and says how many.

      To leave the missing codes out with `spearman` too, run the Missing values node first.
subtitle: '{x} ~ {y}'
template:
- when: method=spearman
  code: |
    {out.stat} = {in.data}.analysis.spearman({x!r}, {y!r})
- when: method!=spearman
  code: |
    {out.stat} = {in.data}.analysis.correlation({x!r}, {y!r}, method={method!r})
preview: stat
