type: analyze.correlation
category: analyze
title: Correlation
description: Pearson, Spearman or Kendall correlation between two variables, with its p-value and N — Pearson with a 95 % CI, and weighted when a weight is applied.
inputs:
  data: SurveyData
outputs:
  stat: Stat
params:
  x:
    kind: variable
    required: true
    scales:
    - ordinal
    - interval
    - ratio
    label: X
  y:
    kind: variable
    required: true
    scales:
    - ordinal
    - interval
    - ratio
    label: Y
  method:
    kind: enum
    values:
    - pearson
    - spearman
    - kendall
    default: spearman
    label: Method
    help: Spearman and Kendall (tau-b) correlate ranks and suit rating scales; Pearson measures a straight-line relationship and gives a 95 % CI. Pearson is weighted when a weight is applied, the rank methods are not and say so. Pearson and Kendall leave the codebook's missing codes (a 9 = Refused) out and say how many. Spearman, the default, counts them as answers — as this node always has, so flows made before keep their numbers — and says so in missing_codes_counted; run Missing values first to leave them out.
subtitle: '{x} ~ {y}'
template:
- when: method=spearman
  code: |
    {out.stat} = {in.data}.analysis.spearman({x!r}, {y!r})
- when: method!=spearman
  code: |
    {out.stat} = {in.data}.analysis.correlation({x!r}, {y!r}, method={method!r})
preview: stat
