type: analyze.factor
category: analyze
title: Factor analysis
description: Exploratory factor analysis of a set of items — loadings, communalities, variance explained, KMO and Bartlett's test, factor correlations, and factor scores if wanted.
inputs:
  data: SurveyData
outputs:
  data: SurveyData
  loadings: Table
  variance: Table
  correlations: Table
  stat: Stat
params:
  items:
    kind: variables
    required: true
    scales:
    - ordinal
    - interval
    - ratio
    label: Items
    help: Three or more, analyzed as standardized scores (their correlations). A respondent missing any item is left out; the codebook's missing codes count as missing.
  n_factors:
    kind: int
    minimum: 1
    label: Factors
    help: Empty chooses the number by the rule below.
  criterion:
    kind: enum
    values:
    - kaiser
    - parallel
    default: kaiser
    label: Number of factors by
    help: When Factors is empty. kaiser keeps the eigenvalues above 1; parallel keeps the factors whose eigenvalue beats the 95th percentile of 100 random data sets of the same size, drawn from Seed.
  method:
    kind: enum
    values:
    - minres
    - principal
    - ml
    default: minres
    label: Extraction
    help: minres (minimum residual) as psych and factor_analyzer; principal is iterated principal axis factoring; ml is maximum likelihood, as R's factanal, and adds a test of fit; it is started from 14 fixed points and keeps the best, and warns when they disagree (often a sign of too many factors).
  rotation:
    kind: enum
    values:
    - varimax
    - promax
    - oblimin
    - none
    default: varimax
    label: Rotation
    help: varimax keeps the factors uncorrelated. promax and oblimin let them correlate and report how much (the correlations output); their loadings are the pattern matrix.
  sort:
    kind: bool
    default: false
    label: Sort items by factor
  hide_below:
    kind: float
    default: 0
    minimum: 0
    maximum: 1
    label: Hide loadings below
    help: Blank out the loadings smaller than this in the table (0 shows every loading), so the structure reads at a glance.
  scores:
    kind: bool
    default: false
    label: Add factor scores
    help: Regression-method scores, one variable per factor, missing for the respondents left out.
  into:
    kind: string
    default: factor_
    label: Score variable prefix
    help: The scores are named <prefix>1, <prefix>2, … — with Add factor scores on. The prefix itself is not a variable.
  seed:
    kind: int
    default: 42
    label: Seed (parallel analysis)
subtitle: '{method}, {rotation}: {items}'
imports:
- from siamang.data import factor
template:
- |
  # Unweighted: on weighted data the statistics say the weight is not applied.
  _factors = factor.analyze(
      {in.data},
      {items!r},
      n_factors={n_factors!r},
      criterion={criterion!r},
      method={method!r},
      rotation={rotation!r},
      sort={sort!r},
      hide_below={hide_below!r},
# The score prefix is read only with Add factor scores on, the seed only by
# parallel analysis; the fragments continue the call above, so the inspector
# asks for neither when the run would ignore it.
- when: scores=True
  code: |2
        scores=True,
        into={into!r},
# Chosen by a rule, a score the rule did not keep is made, empty and labeled
# why, only when a node downstream names it: read_after lists those names.
- when: scores=True & n_factors=None
  code: |2
        read_later={read_after!r},
- when: criterion=parallel
  code: |2
        seed={seed!r},
- |
  )
  {out.data} = _factors.data
  {out.loadings} = _factors.loadings
  {out.variance} = _factors.variance
  {out.correlations} = _factors.correlations
  {out.stat} = _factors.stats
preview: table
