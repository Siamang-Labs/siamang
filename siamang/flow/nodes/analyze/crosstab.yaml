type: analyze.crosstab
category: analyze
title: Crosstab
description: Cross-tabulation with a chi-square test and Cramér's V, or Fisher's exact test for small tables.
inputs:
  data: SurveyData
outputs:
  table: Table
  stat: Stat
params:
  row:
    kind: variable
    required: true
    scales:
    - nominal
    - ordinal
    label: Rows
  col:
    kind: variable
    required: true
    scales:
    - nominal
    - ordinal
    label: Columns
  pct:
    kind: enum
    values:
    - none
    - row
    - col
    - total
    default: col
    label: Percentages
  test:
    kind: bool
    default: true
    label: Significance test
  method:
    kind: enum
    values:
    - chi2
    - fisher
    default: chi2
    label: Test
    help: |-
      Which significance test the table gets:
      - `chi2` — chi-square with Cramér's V, on Kish's effective base when weighted. It keeps the codebook's missing codes as rows and columns of their own, as it always has, and says so.
      - `fisher` — Fisher's exact test, which suits small counts. It counts respondents, unweighted, and leaves the codebook's missing codes out of the table and the test.

      For a 2 × 2 table Fisher gives the odds ratio and its 95 % CI. Larger tables use the Fisher-Freeman-Halton test: exact, or from 20,000 random tables with a fixed seed when there are too many to sum.
subtitle: '{row} × {col}'
checks:
- when: test=False & method=fisher
  severity: warning
  message: Fisher's exact test is not run while Significance test is off.
template:
- when: method=chi2
  code: |
    {out.table} = {in.data}.report.crosstab({row!r}, {col!r}, pct={pct!r}, test={test!r})
- when: method=fisher
  code: |
    {out.table} = {in.data}.report.crosstab(
        {row!r}, {col!r}, pct={pct!r}, test={test!r}, method={method!r}
    )
- |
  {out.stat} = {out.table}.stats
preview: table
