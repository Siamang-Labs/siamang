type: analyze.crosstab
category: analyze
title: Crosstab
description: Cross-tabulation with a chi-square test and Cramér's V, or Fisher's exact test for small tables.
inputs:
  data: SurveyData
outputs:
  table: Table
  stat: Stat
params:
  row:
    kind: variable
    required: true
    scales:
    - nominal
    - ordinal
    label: Rows
  col:
    kind: variable
    required: true
    scales:
    - nominal
    - ordinal
    label: Columns
  pct:
    kind: enum
    values:
    - none
    - row
    - col
    - total
    default: col
    label: Percentages
  test:
    kind: bool
    default: true
    label: Significance test
  method:
    kind: enum
    values:
    - chi2
    - fisher
    default: chi2
    label: Test
    help: Chi-square with Cramér's V, on Kish's effective base when weighted. Fisher's exact test suits small counts; for 2 × 2 it gives the odds ratio and its 95 % CI, larger tables use the Fisher-Freeman-Halton test (exact, or from 20,000 random tables with a fixed seed when there are too many to sum). Fisher counts respondents, unweighted, and leaves the codebook's missing codes out.
subtitle: '{row} × {col}'
checks:
- when: test=False & method=fisher
  severity: warning
  message: Fisher's exact test is not run while Significance test is off.
template:
- when: method=chi2
  code: |
    {out.table} = {in.data}.report.crosstab({row!r}, {col!r}, pct={pct!r}, test={test!r})
- when: method=fisher
  code: |
    {out.table} = {in.data}.report.crosstab(
        {row!r}, {col!r}, pct={pct!r}, test={test!r}, method={method!r}
    )
- |
  {out.stat} = {out.table}.stats
preview: table
