type: analyze.cluster
category: analyze
title: Cluster (k-means)
description: Segment respondents on a set of items; adds a cluster variable and returns the centroids.
inputs:
  data: SurveyData
outputs:
  data: SurveyData
  table: Table
  stat: Stat
params:
  items:
    kind: variables
    required: true
    scales:
    - ordinal
    - interval
    - ratio
    label: Items
  k:
    kind: int
    default: 3
    minimum: 2
    maximum: 12
    label: Clusters
  into:
    kind: string
    default: cluster
    creates: variable
    label: Cluster variable
  seed:
    kind: int
    default: 42
    label: Seed
    help: The random draws of ten k-means++ starts; the start with the smallest within-cluster sum of squares is kept, so the clusters do not depend on the order of the rows.
  standardize:
    kind: bool
    default: true
    label: Standardize items
  number_by:
    kind: variable
    scales:
    - ordinal
    - interval
    - ratio
    label: Number clusters by
    help: Optional, one of the Items. Empty, the clusters are numbered by size, largest first; set, by this item's mean, lowest first. Two segments of close sizes swap numbers when a few respondents come or go, and a name given to a number (with Derive) then lands on the other segment; numbered by the item that tells them apart, each keeps its number.
subtitle: '{k} clusters → {into}'
template:
# Number clusters by is written only when it is set, so a stored flow renders
# the code it did.
- when: number_by=None
  code: |
    _clusters = {in.data}.cluster({items!r}, k={k!r}, into={into!r}, seed={seed!r}, standardize={standardize!r})
- when: number_by!=None
  code: |
    _clusters = {in.data}.cluster(
        {items!r},
        k={k!r},
        into={into!r},
        seed={seed!r},
        standardize={standardize!r},
        number_by={number_by!r},
    )
- |
  {out.data} = _clusters.data
  {out.table} = _clusters.centroids
  {out.stat} = _clusters.stats
preview: table
