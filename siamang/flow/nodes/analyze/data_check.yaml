type: analyze.data_check
category: analyze
title: Data check
description: |-
  The data against its codebook before any analysis: each problem, with how many rows have it and examples.

  It finds problems such as:
  - values outside the valid range
  - codes without a label
  - duplicate IDs
  - columns nobody declared
inputs:
  data: SurveyData
outputs:
  table: Table
  stat: Stat
params:
  variables:
    kind: variables
    default: []
    label: Variables
    help: Check only these. Empty checks every column and every codebook variable.
subtitle: '{variables}'
template: |
  {out.table} = {in.data}.report.data_check({variables!r})
  {out.stat} = {out.table}.stats
preview: table
