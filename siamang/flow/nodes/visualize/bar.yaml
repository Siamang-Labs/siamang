type: visualize.bar
category: visualize
title: Bar chart
description: Distribution of a variable, or its mean by group.
inputs:
  data: SurveyData
outputs:
  chart: Chart
params:
  variable:
    kind: variable
    required: true
    label: Variable
  by:
    kind: variable
    scales:
    - nominal
    - ordinal
    label: By
  horizontal:
    kind: bool
    default: false
    label: Horizontal
  show_values:
    kind: bool
    default: true
    label: Show values
  title:
    kind: string
    label: Title
  width:
    kind: float
    default: 10
    minimum: 2
    maximum: 30
    label: Figure width (in)
    help: The figure itself, in inches — the axis labels scale with it.
  height:
    kind: float
    default: 6
    minimum: 2
    maximum: 30
    label: Figure height (in)
  palette:
    kind: enum
    values:
    - muted
    - deep
    - pastel
    - dark
    - colorblind
    - Set2
    - tab10
    default: muted
    label: Palette
subtitle: '{variable}'
template: |
  {out.chart} = {in.data}.plot.bar({variable!r}, by={by!r}, horizontal={horizontal!r}, show_values={show_values!r}, title={title!r}, figsize=({width!r}, {height!r}), palette={palette!r})
preview: chart
