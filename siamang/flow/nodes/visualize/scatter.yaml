type: visualize.scatter
category: visualize
title: Scatter plot
description: Two variables against each other with a trend line.
inputs:
  data: SurveyData
outputs:
  chart: Chart
params:
  x:
    kind: variable
    required: true
    scales:
    - interval
    - ratio
    - ordinal
    label: X
  y:
    kind: variable
    required: true
    scales:
    - interval
    - ratio
    - ordinal
    label: Y
  hue:
    kind: variable
    scales:
    - nominal
    - ordinal
    label: Color by
  trendline:
    kind: bool
    default: true
    label: Trend line
  title:
    kind: string
    label: Title
  width:
    kind: float
    default: 10
    minimum: 2
    maximum: 30
    label: Figure width (in)
    help: The figure itself, in inches — the axis labels scale with it.
  height:
    kind: float
    default: 6
    minimum: 2
    maximum: 30
    label: Figure height (in)
  palette:
    kind: enum
    values:
    - muted
    - deep
    - pastel
    - dark
    - colorblind
    - Set2
    - tab10
    default: muted
    label: Palette
subtitle: '{x} vs {y}'
template: |
  {out.chart} = {in.data}.plot.scatter({x!r}, {y!r}, hue={hue!r}, trendline={trendline!r}, title={title!r}, figsize=({width!r}, {height!r}), palette={palette!r})
preview: chart
