type: visualize.boxplot
category: visualize
title: Box plot
description: Distribution of a variable across groups.
inputs:
  data: SurveyData
outputs:
  chart: Chart
params:
  y:
    kind: variable
    required: true
    scales:
    - ordinal
    - interval
    - ratio
    label: Variable
  by:
    kind: variable
    required: true
    scales:
    - nominal
    - ordinal
    label: By
  show_points:
    kind: bool
    default: false
    label: Show points
  title:
    kind: string
    label: Title
  width:
    kind: float
    default: 10
    minimum: 2
    maximum: 30
    label: Figure width (in)
    help: The figure itself, in inches — the axis labels scale with it.
  height:
    kind: float
    default: 6
    minimum: 2
    maximum: 30
    label: Figure height (in)
  palette:
    kind: enum
    values:
    - muted
    - deep
    - pastel
    - dark
    - colorblind
    - Set2
    - tab10
    default: muted
    label: Palette
subtitle: '{y} by {by}'
template: |
  {out.chart} = {in.data}.plot.boxplot({y!r}, by={by!r}, show_points={show_points!r}, title={title!r}, figsize=({width!r}, {height!r}), palette={palette!r})
preview: chart
