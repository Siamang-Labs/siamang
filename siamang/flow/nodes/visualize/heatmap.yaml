type: visualize.heatmap
category: visualize
title: Heatmap
description: Correlation matrix of several items (Spearman, Pearson or Kendall), or their means by group.
inputs:
  data: SurveyData
outputs:
  chart: Chart
params:
  items:
    kind: variables
    required: true
    label: Items
  by:
    kind: variable
    scales:
    - nominal
    - ordinal
    label: By
    help: Each item's mean in each group of this variable (weighted when a weight is applied). With a named Colour map it is drawn as it always was, over the respondents who answered every item, a missing code such as 99 = Not applicable counting as an answer (run Missing values first to leave it out). With Colour map theme each cell is the mean of the group's respondents who answered the item, as Group means gives it, the codebook's missing codes left out and counted, long items numbered and each group's base under its name.
  method:
    kind: enum
    values:
    - pearson
    - spearman
    - kendall
    default: spearman
    label: Method
    help: The correlation drawn without By, over the respondents who answered every item. Spearman, the default, reads the answers as it always has (a missing code such as 9 = Refused counts as an answer; run Missing values first to leave it out). Pearson and Kendall leave the codebook's missing codes out and say so, as Correlation matrix does; Pearson is weighted when a weight is applied, Kendall says it is not.
  title:
    kind: string
    label: Title
  width:
    kind: float
    default: 10
    minimum: 2
    maximum: 30
    label: Figure width (in)
    help: The figure itself, in inches — the axis labels scale with it.
  height:
    kind: float
    default: 6
    minimum: 2
    maximum: 30
    label: Figure height (in)
  cmap:
    kind: string
    default: YlOrRd
    label: Color map
    help: A matplotlib colormap, used when means are shown by a group; a correlation matrix keeps its own diverging scale. Type theme for the colours of the report the chart is saved in — its Save report Look's sequential colour for the means, its diverging pair for a correlation matrix, with its text colour, grid and font.
checks:
- when: by & method!=spearman
  severity: warning
  message: Method applies to the correlation matrix drawn without By; with By the heatmap shows means.
# The Spearman fragment is the line this node has always written: a stored
# flow renders the same code.
template:
- when: method=spearman
  code: |
    {out.chart} = {in.data}.plot.heatmap({items!r}, by={by!r}, title={title!r}, figsize=({width!r}, {height!r}), cmap={cmap!r})
- when: method!=spearman
  code: |
    {out.chart} = {in.data}.plot.heatmap(
        {items!r},
        by={by!r},
        method={method!r},
        title={title!r},
        figsize=({width!r}, {height!r}),
        cmap={cmap!r},
    )
preview: chart
