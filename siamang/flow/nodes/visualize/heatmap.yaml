type: visualize.heatmap
category: visualize
title: Heatmap
description: Correlation matrix of several items (Spearman, Pearson or Kendall), or their means by group.
inputs:
  data: SurveyData
outputs:
  chart: Chart
params:
  items:
    kind: variables
    required: true
    label: Items
  by:
    kind: variable
    scales:
    - nominal
    - ordinal
    label: By
    help: |-
      Each item's mean in each group of this variable (weighted when a weight is applied). How the means are taken depends on Color map:
      - a named color map — drawn as it always was, over the respondents who answered every item. A missing code such as `99` = Not applicable counts as an answer; run the Missing values node first to leave it out.
      - `theme` — each cell is the mean of the group's respondents who answered the item, as Group means gives it. The codebook's missing codes are left out and counted, long items are numbered, and each group's base is under its name.
  method:
    kind: enum
    values:
    - pearson
    - spearman
    - kendall
    default: spearman
    label: Method
    help: |-
      The correlation drawn without By, over the respondents who answered every item:
      - `pearson` — weighted when a weight is applied. It leaves the codebook's missing codes out and says so, as Correlation matrix does.
      - `spearman` — the default. It is not weighted; when a weight is applied, its title says so. It reads the answers as it always has, so a missing code such as `9` = Refused counts as an answer; run the Missing values node first to leave it out.
      - `kendall` — not weighted; when a weight is applied, it says so. It leaves the codebook's missing codes out and says so.
  title:
    kind: string
    label: Title
  width:
    kind: float
    default: 10
    minimum: 2
    maximum: 30
    label: Figure width (in)
    help: The figure itself, in inches — the axis labels scale with it.
  height:
    kind: float
    default: 6
    minimum: 2
    maximum: 30
    label: Figure height (in)
  cmap:
    kind: string
    default: YlOrRd
    label: Color map
    help: |-
      A matplotlib colormap, such as `YlOrRd`, used when means are shown by a group; a correlation matrix keeps its own diverging scale.

      Type `theme` for the colors of the report the chart is saved in: its Save report Look's sequential color for the means and its diverging pair for a correlation matrix, with its text color, grid and font.
checks:
- when: by & method!=spearman
  severity: warning
  message: Method applies to the correlation matrix drawn without By; with By the heatmap shows means.
# The Spearman fragment is the line this node has always written: a stored
# flow renders the same code.
template:
- when: method=spearman
  code: |
    {out.chart} = {in.data}.plot.heatmap({items!r}, by={by!r}, title={title!r}, figsize=({width!r}, {height!r}), cmap={cmap!r})
- when: method!=spearman
  code: |
    {out.chart} = {in.data}.plot.heatmap(
        {items!r},
        by={by!r},
        method={method!r},
        title={title!r},
        figsize=({width!r}, {height!r}),
        cmap={cmap!r},
    )
preview: chart
