type: visualize.trend
category: visualize
title: Trend
description: 'A measure over waves or dates, as a chart and as a table: the percent choosing an answer, a mean, or the count of respondents. One line per group, with its confidence band and the base of every point.'
inputs:
  data: SurveyData
outputs:
  chart: Chart
  table: Table
params:
  time:
    kind: variable
    required: true
    label: Time
    extra:
      created_at: Response date (created_at)
      submitted_at: Submission time (submitted_at)
      updated_at: Last change (updated_at)
      started_at: Start time (started_at)
    help: |-
      The waves or dates the measure is tracked over, in one of two forms:
      - a wave code — one point per wave, ordered by code, its labels on the axis
      - a date — a date column, or text in ISO 8601 such as the responses' `created_at` (`2026-05-25 09:00:00+00:00`)

      Times with a zone are read in UTC.
  period:
    kind: enum
    values:
    - day
    - week
    - month
    - quarter
    - year
    default: month
    label: Period
    help: |-
      How dates are grouped into points. Not used for a wave code.

      A `week` is an ISO week, Monday to Sunday, labeled by its ISO year and number (`2026-W22`).

      Every period between the first and the last is on the axis, an empty one as a gap.
  measure:
    kind: enum
    values:
    - percent
    - mean
    - count
    default: percent
    label: Measure
    help: |-
      What each point is:
      - `percent` — the share of those who answered that gave one of the Answer codes
      - `mean` — the mean of a numeric (or ordinal) variable
      - `count` — the number of respondents; the sum of weights when weighted
  variable:
    kind: variable
    label: Measure variable
    help: The question the percent or the mean is of. Its missing codes are left out of every base and counted.
  codes:
    kind: json
    label: Answer codes
    help: The answer counted, or a list of them counted together (a top-2 box), e.g. `[4, 5]`. For a multiple-choice question, choosing any of them.
  by:
    kind: variable
    scales:
    - nominal
    - ordinal
    label: Split by
    help: One line per group. Respondents with a missing code, or no answer, are in no line.
  band:
    kind: bool
    default: true
    label: Confidence band
    help: |-
      The 95% interval of each point, on Kish's effective base when weighted:
      - a percent — its Wilson score interval, as the Bar chart's intervals
      - a mean — its t interval

      A point with fewer respondents than Minimum base is drawn without it; the table gives its interval.
  min_base:
    kind: int
    default: 30
    minimum: 1
    label: Minimum base
    help: A percent or a mean of fewer respondents than this is drawn hollow and noted in the table. Not used for the count, which is its own base.
  title:
    kind: string
    label: Title
  width:
    kind: float
    default: 10
    minimum: 2
    maximum: 30
    label: Figure width (in)
    help: The figure itself, in inches — the axis labels scale with it.
  height:
    kind: float
    default: 6
    minimum: 2
    maximum: 30
    label: Figure height (in)
  palette:
    kind: enum
    values:
    - muted
    - deep
    - pastel
    - dark
    - colorblind
    - Set2
    - tab10
    - theme
    default: muted
    label: Palette
    help: |-
      `theme` takes the colors of the report the chart is saved in: the chart colors of its Save report's Look, with its text color, grid and font. By default those are eight colors any two of which readers with protanopia or deuteranopia can tell apart.

      The others are seaborn's palettes.

      Past four lines, each line's points also take a shape of their own.
subtitle:
- when: measure=percent
  text: '{variable} = {codes} over {time}'
- when: measure=mean
  text: mean {variable} over {time}
- respondents over {time}
checks:
- when: measure=percent
  require: variable
  message: Name the Measure variable whose answers are counted.
- when: measure=percent
  require: codes
  message: Name the Answer codes whose percent is tracked — one code, or a list such as [4, 5].
- when: measure=mean
  require: variable
  message: Name the Measure variable whose mean is tracked.
template:
- when: measure=percent
  code: |
    {out.chart} = {in.data}.plot.trend(
        {time!r},
        period={period!r},
        measure="percent",
        variable={variable!r},
        codes={codes!r},
        by={by!r},
        band={band!r},
        min_base={min_base!r},
        title={title!r},
        figsize=({width!r}, {height!r}),
        palette={palette!r},
    )
- when: measure=mean
  code: |
    {out.chart} = {in.data}.plot.trend(
        {time!r},
        period={period!r},
        measure="mean",
        variable={variable!r},
        by={by!r},
        band={band!r},
        min_base={min_base!r},
        title={title!r},
        figsize=({width!r}, {height!r}),
        palette={palette!r},
    )
- when: measure=count
  code: |
    {out.chart} = {in.data}.plot.trend(
        {time!r},
        period={period!r},
        measure="count",
        by={by!r},
        title={title!r},
        figsize=({width!r}, {height!r}),
        palette={palette!r},
    )
- |
  # The same points as a table — period × group, the measure and its base —
  # for a report or a Live tile.
  {out.table} = {out.chart}.table
preview: chart
